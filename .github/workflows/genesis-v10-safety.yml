name: Genesis V11 Safety

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/genesis-v10/**'
      - 'tests/genesis-v11/**'
      - 'tests/ares-flight/**'
      - 'tests/mars/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - 'tests/solana/**'
      - 'tests/x-oauth/**'
      - 'supabase/functions/**'
      - 'docs/genesis-v11-source-evidence.json'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.app.json'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/genesis-v10-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genesis-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Deno for locked Edge Function tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --registry=https://registry.npmjs.org/ --no-fund

      - name: Complete release checks including audit and production build
        run: npm run test:release

      - name: Verify no hardcoded site approval
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {
            ARES_GENESIS_PRODUCTION_SITE
          } from './src/core/mars/exploration/genesis-v5/production-site.mjs';

          assert.equal(ARES_GENESIS_PRODUCTION_SITE, null);
          console.log('NO_HARDCODED_SITE_APPROVAL_PASS');
          JS
