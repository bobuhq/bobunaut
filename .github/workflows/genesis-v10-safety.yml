name: Genesis V10 Safety

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/core/mars/exploration/genesis-v5/**'
      - 'src/core/mars/exploration/MarsExploreWorld.tsx'
      - 'public/mars/ares-genesis/**'
      - 'tests/genesis-v10/**'
      - '.github/workflows/genesis-v10-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genesis-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          node --version
          npm --version
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          for attempt in 1 2; do
            echo "NPM INSTALL ATTEMPT ${attempt}/2"

            if npm ci --no-audit --no-fund               --loglevel=verbose               > "$RUNNER_TEMP/genesis-npm-install.log" 2>&1; then
              echo "NPM_INSTALL_PASS"
              exit 0
            fi

            tail -80 "$RUNNER_TEMP/genesis-npm-install.log"

            if [ "$attempt" -eq 1 ]; then
              rm -rf node_modules
            fi
          done

          echo "NPM_INSTALL_FAILED"
          exit 1

      - name: Genesis fail-closed safety tests
        run: node tests/genesis-v10/release-safety.mjs

      - name: Production build
        run: npm run build

      - name: Verify no hardcoded site approval
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {
            ARES_GENESIS_PRODUCTION_SITE
          } from './src/core/mars/exploration/genesis-v5/production-site.mjs';

          assert.equal(ARES_GENESIS_PRODUCTION_SITE, null);
          console.log('NO_HARDCODED_SITE_APPROVAL_PASS');
          JS
